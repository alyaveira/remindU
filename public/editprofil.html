<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemindU - Edit Profil</title>
    <script>
    (function(){
        var t = localStorage.getItem('remindu_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(145deg, #f5f7fe 0%, #eef2fa 100%); padding: 20px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 36px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1); overflow: hidden; }
        .page-content { padding: 28px 24px 36px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .btn-back { background: none; border: none; font-size: 16px; font-weight: 500; color: #8b5cf6; cursor: pointer; padding: 8px 12px; border-radius: 30px; }
        .btn-back:hover { background: #f1f5f9; }
        h2 { font-size: 24px; font-weight: 600; background: linear-gradient(135deg, #8b5cf6, #6d28d9); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn-save { background: #8b5cf6; color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-save:hover { background: #7c3aed; transform: translateY(-1px); }
        .avatar-section { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
        .avatar-preview { width: 80px; height: 80px; background: linear-gradient(145deg, #8b5cf6, #6d28d9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background-size: cover; background-position: center; }
        .avatar-buttons { flex: 1; display: flex; gap: 12px; flex-wrap: wrap; }
        .avatar-buttons button { background: #f1f5f9; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .avatar-buttons button:hover { background: #e2e8f0; }
        .avatar-choices { margin: 20px 0; display: flex; gap: 12px; flex-wrap: wrap; border-top: 1px solid #edf2f7; padding-top: 20px; }
        .avatar-option { width: 60px; height: 60px; background: #f8fafc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; border: 2px solid transparent; }
        .avatar-option:hover { transform: scale(1.05); background: #ede9fe; }
        .avatar-option.selected { border-color: #8b5cf6; background: #ede9fe; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; border: 1px solid #e2e8f0; border-radius: 28px; padding: 12px 45px 12px 18px; font-size: 15px; outline: none; background: #f8fafc; }
        .input-wrapper input:focus { border-color: #8b5cf6; background: white; }
        .input-wrapper i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #8b5cf6; font-size: 20px; pointer-events: none; }
        hr { margin: 20px 0; border: none; border-top: 1px solid #edf2f7; }
        .password-note { font-size: 12px; color: #94a3b8; margin-top: 6px; }
        @media (min-width: 768px) { .page-content { padding: 40px 48px; } }

        /* ========== DARK MODE CSS ========== */
        [data-theme="dark"] body { background: linear-gradient(145deg, #0a0a0f 0%, #0f0f15 100%); }
        [data-theme="dark"] .container { background: #1a1a24; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4); }
        [data-theme="dark"] .btn-back { color: #a78bfa; }
        [data-theme="dark"] .btn-back:hover { background: #2d2d3a; }
        [data-theme="dark"] .avatar-buttons button { background: #13131e; color: #94a3b8; }
        [data-theme="dark"] .avatar-buttons button:hover { background: #2d1f5e; color: #a78bfa; }
        [data-theme="dark"] .avatar-choices { border-top-color: #2a2a3a; }
        [data-theme="dark"] .avatar-option { background: #13131e; }
        [data-theme="dark"] .avatar-option:hover { background: #2d1f5e; }
        [data-theme="dark"] .avatar-option.selected { border-color: #a78bfa; background: #2d1f5e; }
        [data-theme="dark"] .form-group label { color: #94a3b8; }
        [data-theme="dark"] .input-wrapper input { background: #13131e; border-color: #2a2a3a; color: #f1f5f9; }
        [data-theme="dark"] .input-wrapper input:focus { border-color: #a78bfa; background: #1a1a2a; }
        [data-theme="dark"] hr { border-top-color: #2a2a3a; }
        [data-theme="dark"] .password-note { color: #64748b; }
    </style>
</head>
<body>
<div class="container">
    <div class="page-content">
        <div class="header">
            <button class="btn-back" id="backBtn">← Back</button>
            <h2>Edit Profil</h2>
            <button class="btn-save" id="saveBtn">Save</button>
        </div>

        <div class="avatar-section">
            <div class="avatar-preview" id="avatarPreview">👤</div>
            <div class="avatar-buttons">
                <button id="changeAvatarBtn"><i class="material-icons-round">style</i> Change Avatar</button>
                <button id="changePhotoBtn"><i class="material-icons-round">photo_camera</i> Change Photo</button>
            </div>
        </div>

        <input type="file" id="photoInput" accept="image/png, image/jpeg, image/jpg" style="display: none;">

        <div id="avatarGrid" style="display: none;" class="avatar-choices">
            <div class="avatar-option" data-avatar="😀">😀</div>
            <div class="avatar-option" data-avatar="😎">😎</div>
            <div class="avatar-option" data-avatar="🐱">🐱</div>
            <div class="avatar-option" data-avatar="🌟">🌟</div>
            <div class="avatar-option" data-avatar="🎓">🎓</div>
            <div class="avatar-option" data-avatar="💪">💪</div>
        </div>

        <div class="form-group">
            <label>First Name</label>
            <div class="input-wrapper">
                <input type="text" id="firstName" placeholder="Nama depan">
                <i class="material-icons-round">edit</i>
            </div>
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <div class="input-wrapper">
                <input type="text" id="lastName" placeholder="Nama belakang">
                <i class="material-icons-round">edit</i>
            </div>
        </div>

        <hr>

        <div class="form-group">
            <label>New Password (opsional)</label>
            <div class="input-wrapper">
                <input type="password" id="newPassword" placeholder="Kosongkan jika tidak ingin ganti password">
                <i class="material-icons-round">lock</i>
            </div>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <div class="input-wrapper">
                <input type="password" id="confirmPassword" placeholder="">
                <i class="material-icons-round">lock</i>
            </div>
        </div>
        <div class="password-note">Password minimal 8 karakter, huruf kecil & angka.</div>
    </div>
</div>

<button id="darkFab" style="position:fixed;bottom:88px;right:18px;z-index:9999;width:44px;height:44px;border-radius:50%;border:none;background:var(--purple);color:white;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(139,92,246,0.35);display:flex;align-items:center;justify-content:center;">🌙</button>

<script>
    const API_URL = 'http://localhost:3000/api';
    const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
    const userEmail = userData.email;
    
    if (!userEmail) {
        alert('Sesi login tidak ditemukan.');
        window.location.href = 'welcome.html';
    }

    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const avatarPreview = document.getElementById('avatarPreview');
    const changeAvatarBtn = document.getElementById('changeAvatarBtn');
    const changePhotoBtn = document.getElementById('changePhotoBtn');
    const avatarGrid = document.getElementById('avatarGrid');
    const photoInput = document.getElementById('photoInput');

    let currentAvatar = localStorage.getItem('user_avatar') || userEmail.charAt(0).toUpperCase();

    function displayAvatar(avatar) {
        if (avatar && avatar.startsWith('data:image')) {
            avatarPreview.textContent = '';
            avatarPreview.style.backgroundImage = `url(${avatar})`;
            avatarPreview.style.backgroundSize = 'cover';
            avatarPreview.style.backgroundPosition = 'center';
        } else {
            avatarPreview.textContent = avatar;
            avatarPreview.style.backgroundImage = '';
        }
    }

    displayAvatar(currentAvatar);

    async function loadProfile() {
        try {
            const response = await fetch(`${API_URL}/profile`, {
                method: 'GET',
                headers: { 
                    'X-User-Email': userEmail,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Gagal mengambil profil');
            }
            const data = await response.json();
            firstNameInput.value = data.nama_depan || '';
            lastNameInput.value = data.nama_belakang || '';
        } catch (err) {
            console.error('Load profile error:', err);
            alert('Gagal memuat profil: ' + err.message);
        }
    }

    async function saveProfile() {
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!firstName || !lastName) {
            alert('Nama depan dan belakang wajib diisi');
            return;
        }

        const payload = { firstName, lastName };
        if (newPassword || confirmPassword) {
            if (newPassword !== confirmPassword) {
                alert('Konfirmasi password tidak cocok');
                return;
            }
            if (newPassword.length < 8 || !/[a-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                alert('Password minimal 8 karakter, huruf kecil & angka');
                return;
            }
            payload.newPassword = newPassword;
            payload.confirmPassword = confirmPassword;
        }

        try {
            const response = await fetch(`${API_URL}/profile`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Email': userEmail
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Gagal menyimpan');
            
            localStorage.setItem('user_avatar', currentAvatar);
            
            const updatedUser = JSON.parse(localStorage.getItem('remindu_user') || '{}');
            updatedUser.firstName = firstName;
            localStorage.setItem('remindu_user', JSON.stringify(updatedUser));
            
            alert('Profil berhasil diperbarui!');
            window.location.href = 'profil.html';
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }

    changeAvatarBtn.addEventListener('click', () => {
        avatarGrid.style.display = avatarGrid.style.display === 'none' ? 'flex' : 'none';
    });
    
    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.addEventListener('click', () => {
            document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            currentAvatar = opt.dataset.avatar;
            displayAvatar(currentAvatar);
            avatarGrid.style.display = 'none';
        });
    });

    changePhotoBtn.addEventListener('click', () => {
        photoInput.click();
    });

    photoInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('Harap pilih file gambar (PNG, JPG, JPEG)');
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            alert('Ukuran maksimal 2MB');
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            currentAvatar = base64;
            displayAvatar(currentAvatar);
            document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
            avatarGrid.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'profil.html';
    });
    document.getElementById('saveBtn').addEventListener('click', saveProfile);

    loadProfile();

    // Dark Mode Toggle
    (function(){
        var fab = document.getElementById('darkFab');
        var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        fab.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        fab.addEventListener('click', function(){
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('remindu_theme', next);
            fab.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    })();
</script>
</body>
</html>
