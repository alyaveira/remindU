<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - RemindU</title>
    <style>
        :root { --purple:#8b5cf6; --purple-dark:#7c3aed; --bg:#f5f7fe; --white:#ffffff; --text:#0f172a; --border:#edf2f7; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { max-width:450px; width:100%; background:var(--white); border-radius:32px; padding:40px 28px; box-shadow:0 20px 35px -12px rgba(0,0,0,0.1); text-align:center; }
        h2 { font-size:26px; color:var(--text); margin-bottom:12px; }
        .subtitle { color:#64748b; margin-bottom:28px; }
        .otp-input { width:100%; padding:14px 20px; font-size:18px; text-align:center; letter-spacing:4px; border:1.5px solid var(--border); border-radius:60px; outline:none; transition:0.2s; }
        .otp-input:focus { border-color:var(--purple); box-shadow:0 0 0 4px rgba(139,92,246,0.1); }
        .btn { background:var(--purple); color:white; border:none; border-radius:60px; padding:14px; width:100%; font-weight:700; margin-top:20px; cursor:pointer; transition:0.2s; }
        .btn:hover { background:var(--purple-dark); transform:translateY(-2px); }
        .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px); background:#1e293b; color:white; padding:12px 24px; border-radius:40px; font-size:14px; transition:transform 0.3s; white-space:nowrap; z-index:1000; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .toast.success { background:#10b981; }
        .toast.error { background:#e53e3e; }
        .back-link { display:inline-block; margin-bottom:20px; color:var(--purple); text-decoration:none; font-weight:500; }
        .spinner { width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.4); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <a href="register.html" class="back-link">← Kembali</a>
    <h2>Verifikasi OTP</h2>
    <p class="subtitle">Kode verifikasi telah dikirim ke email Anda.</p>
    <input type="text" class="otp-input" id="otp" placeholder="Kode 6 digit" maxlength="6" inputmode="numeric">
    <button class="btn" id="verifyBtn">Verifikasi</button>
</div>
<div class="toast" id="toast"></div>
<script>
    function showToast(msg, type = '') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + type;
        setTimeout(() => t.classList.remove('show'), 4000);
    }

    const email = localStorage.getItem('pending_verification_email');
    if (!email) {
        showToast('Email tidak ditemukan. Silakan registrasi ulang.', 'error');
        setTimeout(() => window.location.href = 'register.html', 2000);
    }

    document.getElementById('verifyBtn').addEventListener('click', async () => {
        const otp = document.getElementById('otp').value.trim();
        if (!otp || otp.length !== 6) {
            showToast('Masukkan kode OTP 6 digit', 'error');
            return;
        }
        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        try {
            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp })
            });
            const data = await response.json();
            if (response.ok) {
                showToast('✅ Verifikasi berhasil! Silakan login.', 'success');
                localStorage.removeItem('pending_verification_email');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                showToast(data.error || 'Kode OTP salah', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Verifikasi';
            }
        } catch (err) {
            showToast('Gagal verifikasi. Coba lagi.', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Verifikasi';
        }
    });
</script>
</body>
</html>
