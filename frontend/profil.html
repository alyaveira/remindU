<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RemindU - Profil</title>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f7fe 0%, #eef2fa 100%);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .page-content {
            padding: 28px 24px 36px;
        }
        /* Header dengan back button */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            position: relative;
            justify-content: center;
        }
        .btn-back {
            position: absolute;
            left: 0;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8b5cf6;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-back:hover {
            background: #f1f5f9;
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
        }
        /* Menu list */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #f8fafc;
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #edf2f7;
        }
        .menu-item:hover {
            background: #f1f5f9;
            transform: translateX(6px);
        }
        .menu-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-icon {
            font-size: 24px;
            color: #8b5cf6;
        }
        .menu-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .menu-title {
            font-weight: 600;
            color: #1e293b;
            font-size: 16px;
        }
        .menu-sub {
            font-size: 13px;
            color: #64748b;
        }
        .arrow-icon {
            color: #94a3b8;
            font-size: 20px;
        }
        /* Tombol logout terpisah di tengah */
        .logout-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }
        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(229,62,62,0.3);
            width: auto;
            min-width: 160px;
            justify-content: center;
        }
        .logout-btn:hover {
            background: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229,62,62,0.4);
        }
        .logout-btn:active {
            transform: translateY(0);
        }
        .logout-btn i {
            font-size: 20px;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #edf2f7;
        }
        @media (min-width: 768px) {
            .page-content {
                padding: 40px 48px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-content">
        <div class="header">
            <button class="btn-back" id="backBtn"><i class="material-icons-round">arrow_back</i></button>
            <h2>Profil</h2>
        </div>

        <div class="menu-list">
            <!-- Your account -->
            <div class="menu-item" id="yourAccount">
                <div class="menu-left">
                    <i class="material-icons-round menu-icon">person</i>
                    <div class="menu-text">
                        <span class="menu-title">Your account</span>
                        <span class="menu-sub">Edit info</span>
                    </div>
                </div>
                <i class="material-icons-round arrow-icon">chevron_right</i>
            </div>

            <!-- Privacy -->
            <div class="menu-item" id="privacy">
                <div class="menu-left">
                    <i class="material-icons-round menu-icon">lock</i>
                    <div class="menu-text">
                        <span class="menu-title">Privacy</span>
                    </div>
                </div>
                <i class="material-icons-round arrow-icon">chevron_right</i>
            </div>

            <!-- Data backup -->
            <div class="menu-item" id="dataBackup">
                <div class="menu-left">
                    <i class="material-icons-round menu-icon">backup</i>
                    <div class="menu-text">
                        <span class="menu-title">Data backup</span>
                    </div>
                </div>
                <i class="material-icons-round arrow-icon">chevron_right</i>
            </div>

            <!-- Language -->
            <div class="menu-item" id="language">
                <div class="menu-left">
                    <i class="material-icons-round menu-icon">language</i>
                    <div class="menu-text">
                        <span class="menu-title">Language</span>
                    </div>
                </div>
                <i class="material-icons-round arrow-icon">chevron_right</i>
            </div>

            <!-- About -->
            <div class="menu-item" id="about">
                <div class="menu-left">
                    <i class="material-icons-round menu-icon">info</i>
                    <div class="menu-text">
                        <span class="menu-title">About</span>
                    </div>
                </div>
                <i class="material-icons-round arrow-icon">chevron_right</i>
            </div>
        </div>

        <!-- Tombol logout di tengah -->
        <div class="logout-wrapper">
            <button class="logout-btn" id="logoutBtn">
                <i class="material-icons-round">logout</i> Logout
            </button>
        </div>
    </div>
</div>

<script>
    // Cek login
    const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
    if (!userData.email) {
        alert('Sesi login tidak ditemukan. Silakan login ulang.');
        window.location.href = 'welcome.html';
    }

    // Back button
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'home.html';
    });

    // Menu actions (demo)
    document.getElementById('yourAccount').addEventListener('click', () => {
    window.location.href = 'editprofil.html';
    });
    document.getElementById('privacy').addEventListener('click', () => {
        alert('Pengaturan privasi akan segera hadir.');
    });
    document.getElementById('dataBackup').addEventListener('click', () => {
        alert('Cadangan data akan segera hadir.');
    });
    document.getElementById('language').addEventListener('click', () => {
        alert('Pilihan bahasa akan segera hadir.');
    });
    document.getElementById('about').addEventListener('click', () => {
        alert('RemindU - Aplikasi manajemen tugas.\nVersi 1.0.0');
    });

    // Logout button
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('remindu_user');
        window.location.href = 'welcome.html';
    });
</script>
</body>
</html>
