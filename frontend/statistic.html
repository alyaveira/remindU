    <style>
        :root {
            --purple:#8b5cf6; --purple-dark:#7c3aed; --purple-light:#ede9fe;
            --blue:#3b82f6; --orange:#f97316; --green:#10b981; --amber:#f59e0b;
            --pink:#ec4899; --bg:#f5f7fe; --white:#ffffff;
            --text:#0f172a; --text-muted:#64748b; --border:#edf2f7;
            --sidebar-w:260px; --sidebar-collapsed-w:72px; --header-h:64px;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
        body { background:var(--bg); min-height:100vh; overflow-x:hidden; position:relative; }
        .bg-blob { position:fixed; border-radius:50%; filter:blur(60px); opacity:0.38; pointer-events:none; z-index:0; }
        .bg-blob-1 { width:400px; height:400px; background:var(--purple); top:-100px; right:-100px; }
        .bg-blob-2 { width:300px; height:300px; background:#ec4899; bottom:-80px; left:-80px; }

        .layout { display:flex; min-height:100vh; }
        .main-content { flex:1; display:flex; flex-direction:column; min-height:100vh; overflow-y:auto; padding:24px; position:relative; z-index:10; }
        .container { max-width:1000px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:24px; }

        /* Top Bar */
        .top-bar { display:flex; align-items:center; justify-content:between; margin-bottom:12px; width:100%; }
        .btn-back { background:none; border:none; color:var(--purple); font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; padding:8px 12px; border-radius:12px; transition:background 0.2s; font-size:14px; }
        .btn-back:hover { background:var(--purple-light); }
        .page-title { font-size:24px; font-weight:800; color:var(--text); flex:1; text-align:center; margin-right:40px; }

        /* Period Selector Chips */
        .period-selector { display:flex; gap:10px; background:rgba(139,92,246,0.06); padding:6px; border-radius:16px; align-self:center; width:fit-content; }
        .period-btn { background:none; border:none; padding:8px 20px; font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer; border-radius:12px; transition:all 0.2s; }
        .period-btn.active { background:var(--white); color:var(--purple); box-shadow:0 4px 10px rgba(0,0,0,0.04); }

        /* Grid Ringkasan Numerik */
        .summary-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; }
        .summary-card { background:var(--white); border-radius:24px; padding:20px; border:1px solid var(--border); display:flex; flex-direction:column; gap:4px; box-shadow:0 10px 25px rgba(0,0,0,0.01); }
        .card-label { font-size:13px; font-weight:600; color:var(--text-muted); }
        .card-value { font-size:28px; font-weight:800; color:var(--text); }
        
        /* Progress Circle Card */
        .progress-card { background:var(--white); border-radius:28px; padding:24px; border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:20px; box-shadow:0 10px 25px rgba(0,0,0,0.01); }
        .progress-info { display:flex; flex-direction:column; gap:6px; }
        .progress-title { font-size:18px; font-weight:700; color:var(--text); }
        .progress-sub { font-size:13px; color:var(--text-muted); font-weight:500; }
        .circle-box { position:relative; width:90px; height:90px; display:flex; align-items:center; justify-content:center; }
        .circle-svg { transform:rotate(-90deg); width:100%; height:100%; }
        .circle-bg { fill:none; stroke:#f1f5f9; stroke-width:8; }
        .circle-bar { fill:none; stroke:var(--purple); stroke-width:8; stroke-dasharray:251.2; stroke-dashoffset:251.2; stroke-linecap:round; transition:stroke-dashoffset 0.5s ease; }
        .circle-text { position:absolute; font-size:16px; font-weight:800; color:var(--text); }

        /* Task Performance List Section */
        .list-section { background:var(--white); border-radius:28px; border:1px solid var(--border); padding:24px; box-shadow:0 10px 25px rgba(0,0,0,0.01); display:flex; flex-direction:column; gap:16px; }
        .section-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .section-title { font-size:16px; font-weight:700; color:var(--text); }
        
        .task-filter-chips { display:flex; gap:8px; }
        .task-filter-chip { background:#f1f5f9; border:none; padding:6px 14px; font-size:12px; font-weight:600; color:var(--text-muted); border-radius:30px; cursor:pointer; transition:all 0.2s; }
        .task-filter-chip.active { background:var(--purple-light); color:var(--purple); }

        .task-list { display:flex; flex-direction:column; gap:12px; max-height:350px; overflow-y:auto; padding-right:4px; }
        .task-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:#f8fafc; border-radius:16px; border:1px solid var(--border); }
        .row-left { display:flex; align-items:center; gap:12px; min-width:0; }
        .row-icon { width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
        .row-icon.done { background:#e6f4ea; color:var(--green); }
        .row-icon.pending { background:#fef3c7; color:var(--amber); }
        .row-meta { display:flex; flex-direction:column; gap:2px; min-width:0; }
        .row-title { font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .row-date { font-size:11px; color:var(--text-muted); }
        .badge-status { font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
        .badge-status.done { background:#e6f4ea; color:var(--green); }
        .badge-status.pending { background:#fef3c7; color:var(--amber); }

        .empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:14px; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .empty-state i { font-size:36px; color:#cbd5e1; }

        @media(min-width: 600px) {
            .summary-grid { grid-template-columns:repeat(4, 1fr); }
        }

        /* ========== DARK MODE CSS ========== */
        [data-theme="dark"] { --purple:#a78bfa; --purple-dark:#8b5cf6; --purple-light:#2d1f5e; --bg:#0f0f13; --white:#1a1a24; --text:#f1f5f9; --text-muted:#94a3b8; --border:#2a2a3a; }

            if (currentPeriod === 'all') return true;
            if (!task.due_date) return false;
            
            const dDate = new Date(task.due_date);
            if (currentPeriod === 'today') {
                return dDate.toDateString() === now.toDateString();

            if (currentPeriod === 'week') {
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(now.getDate() - 7);
                return dDate >= oneWeekAgo && dDate <= now;
            }
            if (currentPeriod === 'month') {
                return dDate.getMonth() === now.getMonth() && dDate.getFullYear() === now.getFullYear();
            }
            return true;
        });

    // Render baris list tugas performa
    function renderTaskList(tasks) {
        const container = document.getElementById('taskListContainer');
        container.innerHTML = '';

        // Terapkan filter sekunder status baris (Semua / Selesai / Belum)
        let displayTasks = tasks;
        if (currentTaskFilter === 'done') displayTasks = tasks.filter(t => t.selesai);
        if (currentTaskFilter === 'pending') displayTasks = tasks.filter(t => !t.selesai);

        if (displayTasks.length === 0) {
            renderEmptyState();
            return;
        }

        displayTasks.forEach(task => {
            const row = document.createElement('div');
            row.className = 'task-row';

            const dateStr = task.due_date ? new Date(task.due_date).toLocaleDateString(localStorage.getItem('remindu_lang') || 'id', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
            const isDone = task.selesai;
            
            const statusText = isDone 
                ? (window.t ? window.t('statistic.status_done') : 'Selesai') 
                : (window.t ? window.t('statistic.status_pending') : 'Tertunda');

            row.innerHTML = `
                <div class="row-left">
                    <div class="row-icon ${isDone ? 'done' : 'pending'}">
                        <i class="material-icons-round">${isDone ? 'task_alt' : 'radio_button_unchecked'}</i>
                    </div>
                    <div class="row-meta">
                        <span class="row-title">${escapeHtml(task.judul)}</span>
                        <span class="row-date">${dateStr}</span>
                    </div>
                </div>
                <span class="badge-status ${isDone ? 'done' : 'pending'}">${statusText}</span>
            `;
            container.appendChild(row);
        });
    }

    function renderEmptyState() {
        const container = document.getElementById('taskListContainer');
        const txtEmpty = window.t ? window.t('statistic.empty_tasks') : 'Tidak ada catatan tugas pada periode ini';

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
