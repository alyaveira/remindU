<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RemindU - Tambah Reminder</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --purple-light: #ede9fe;
            --bg: #f5f7fe;
            --white: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #edf2f7;
            --sidebar-w: 260px;
            --sidebar-collapsed-w: 72px;
            --header-h: 64px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.38;
            pointer-events: none;
            z-index: 0;
        }
        .bg-blob-1 { width: 400px; height: 400px; background: var(--purple); top: -100px; right: -100px; }
        .bg-blob-2 { width: 300px; height: 300px; background: #ec4899; bottom: -80px; left: -80px; }

        .layout { display: flex; min-height: 100vh; position: relative; z-index: 5; }

        /* SIDEBAR (sama persis dengan home) */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 200;
            transition: width 0.3s cubic-bezier(0.4,0,0.2,1), transform 0.3s;
            overflow: hidden;
            box-shadow: 2px 0 20px rgba(0,0,0,0.04);
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed-w); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 199; backdrop-filter: blur(2px); }
        .sidebar-overlay.show { display: block; }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: var(--header-h);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .brand-wrap { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .brand-logo { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #1e3a8a, #8b5cf6); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; font-weight: 900; color: white; }
        .brand-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #1e3a8a, #3b82f6, #8b5cf6, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; transition: opacity 0.2s, width 0.3s; }
        .sidebar.collapsed .brand-name { opacity: 0; width: 0; }
        .toggle-btn { width: 32px; height: 32px; border-radius: 10px; border: none; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: background 0.2s, color 0.2s; flex-shrink: 0; }
        .toggle-btn:hover { background: var(--purple-light); color: var(--purple); }
        .toggle-btn i { font-size: 20px; transition: transform 0.3s; }
        .sidebar.collapsed .toggle-btn i { transform: rotate(180deg); }

        .sidebar-user {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .sidebar-user:hover { background: var(--bg); }
        .sidebar-avatar { width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, var(--purple), #ec4899); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: white; flex-shrink: 0; background-size: cover; background-position: center; }
        .sidebar-user-info { overflow: hidden; transition: opacity 0.2s; }
        .sidebar.collapsed .sidebar-user-info { opacity: 0; width: 0; }
        .sidebar-user-name { font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; }
        .sidebar-user-email { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }

        .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; overflow-x: hidden; }
        .sidebar-nav::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; padding: 8px 10px 4px; white-space: nowrap; overflow: hidden; transition: opacity 0.2s; }
        .sidebar.collapsed .nav-label { opacity: 0; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; cursor: pointer; transition: all 0.2s; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; }
        .nav-item:hover { background: var(--bg); color: var(--purple); }
        .nav-item.active { background: var(--purple-light); color: var(--purple); font-weight: 600; }
        .nav-item i { font-size: 22px; flex-shrink: 0; }
        .nav-item-label { font-size: 14px; transition: opacity 0.2s; }
        .sidebar.collapsed .nav-item-label { opacity: 0; width: 0; }
        .nav-badge { margin-left: auto; background: var(--purple); color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; transition: opacity 0.2s; }
        .sidebar.collapsed .nav-badge { opacity: 0; }

        .sidebar-footer { padding: 12px 10px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }

        /* MAIN */
        .main {
            flex: 1;
            margin-left: var(--sidebar-w);
            transition: margin-left 0.3s cubic-bezier(0.4,0,0.2,1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main.expanded { margin-left: var(--sidebar-collapsed-w); }

        /* TOPBAR */
        .topbar {
            height: var(--header-h);
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-mobile-toggle { display: none; width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--bg); cursor: pointer; align-items: center; justify-content: center; color: var(--text); transition: background 0.2s; }
        .topbar-mobile-toggle:hover { background: var(--purple-light); }
        .topbar-mobile-toggle i { font-size: 22px; }
        .topbar-greeting { font-size: 15px; font-weight: 600; color: var(--text); }
        .topbar-date { font-size: 12px; color: var(--text-muted); }
        .topbar-right { display: flex; align-items: center; gap: 10px; }
        .topbar-icon-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: all 0.2s; position: relative; }
        .topbar-icon-btn:hover { background: var(--purple-light); color: var(--purple); }
        .topbar-icon-btn i { font-size: 20px; }
        .notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #f97316; border: 2px solid var(--white); }
        .topbar-avatar { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--purple), #ec4899); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: white; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; background-size: cover; background-position: center; }
        .topbar-avatar:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(139,92,246,0.3); }
        .dropdown {
            position: absolute;
            top: 44px;
            right: 0;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 170px;
            overflow: hidden;
            z-index: 300;
            display: none;
            border: 1px solid var(--border);
            animation: dropFade 0.18s ease;
        }
        @keyframes dropFade { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .dropdown.show { display: block; }
        .dd-item { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: var(--text); transition: background 0.15s; }
        .dd-item:hover { background: var(--bg); }
        .dd-item.danger { color: #e53e3e; border-top: 1px solid var(--border); }
        .dd-item i { font-size: 18px; }

        /* PAGE CONTENT (FORM) */
        .page-content {
            flex: 1;
            padding: 28px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        .form-card {
            background: var(--white);
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, var(--purple) 0%, #6d28d9 100%);
            padding: 24px 28px;
            position: relative;
            overflow: hidden;
        }
        .form-header::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .form-header::after {
            content: '';
            position: absolute;
            bottom: -30px;
            left: -20px;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .form-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .form-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin: 0;
        }
        .btn-cancel {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .btn-cancel:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(-2px);
        }
        .btn-save {
            background: white;
            color: var(--purple);
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn-save:hover {
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(139,92,246,0.25);
        }

        .form-body {
            padding: 28px;
        }

        .form-group {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            resize: none;
            font-family: inherit;
            padding: 4px 0;
            color: var(--text);
        }
        .form-group textarea {
            min-height: 80px;
        }
        .remind-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: 0.3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--purple);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .due-date-input {
            margin-top: 12px;
            display: none;
        }
        .due-date-input.active {
            display: block;
        }
        input[type="datetime-local"] {
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 30px;
            background: var(--bg);
            width: 100%;
            font-family: inherit;
            font-size: 14px;
        }
        select {
            appearance: none;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2364748b" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>') no-repeat right 8px center;
            background-size: 16px;
            cursor: pointer;
        }
        .clickable {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clickable:hover {
            opacity: 0.8;
        }
        .add-due-icon {
            color: var(--purple);
            font-size: 20px;
            font-weight: 600;
        }

        /* BOTTOM NAV (mobile) */
        .bottom-nav {
            display: none;
            background: var(--white);
            border-top: 1px solid var(--border);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            padding: 8px 12px 16px;
            justify-content: space-around;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
        }
        .bnav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 16px;
            transition: all 0.2s;
            flex: 1;
        }
        .bnav-item i { font-size: 22px; }
        .bnav-item.active { color: var(--purple); background: var(--purple-light); }
        .bnav-item:hover:not(.active) { color: var(--purple); }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); width: var(--sidebar-w) !important; box-shadow: none; }
            .sidebar.mobile-open { transform: translateX(0); box-shadow: 4px 0 30px rgba(0,0,0,0.15); }
            .main { margin-left: 0 !important; padding-bottom: 70px; }
            .topbar-mobile-toggle { display: flex !important; }
            .bottom-nav { display: flex; }
            .page-content { padding: 16px; }
            .topbar { padding: 0 16px; }
            .form-body { padding: 20px; }
            .form-header { padding: 18px 20px; }
        }
    </style>
</head>
<body>

<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<div class="layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-wrap">
                <div class="brand-logo">R</div>
                <div class="brand-name">RemindU</div>
            </div>
            <button class="toggle-btn" id="sidebarToggle"><i class="material-icons-round">chevron_left</i></button>
        </div>

        <div class="sidebar-user" id="sidebarUser">
            <div class="sidebar-avatar" id="sidebarAvatar">A</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebarName">User</div>
                <div class="sidebar-user-email" id="sidebarEmail">user@email.com</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-label">Menu Utama</div>
            <div class="nav-item" data-nav="home"><i class="material-icons-round">home</i><span class="nav-item-label">Beranda</span></div>
            <div class="nav-item" data-nav="calendar"><i class="material-icons-round">calendar_month</i><span class="nav-item-label">Kalender</span></div>
            <div class="nav-item" data-nav="notification"><i class="material-icons-round">notifications</i><span class="nav-item-label">Notifikasi</span><span class="nav-badge" id="notifBadge">0</span></div>
            <div class="nav-label" style="margin-top:8px;">Lainnya</div>
            <div class="nav-item" data-nav="statistic"><i class="material-icons-round">bar_chart</i><span class="nav-item-label">Statistik</span></div>
            <div class="nav-item" data-nav="settings"><i class="material-icons-round">settings</i><span class="nav-item-label">Pengaturan</span></div>
        </nav>

        <div class="sidebar-footer">
            <div class="nav-item" id="sidebarLogout" style="color:#e53e3e;"><i class="material-icons-round">logout</i><span class="nav-item-label">Keluar</span></div>
        </div>
    </aside>

    <main class="main" id="mainContent">
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-mobile-toggle" id="mobileMenuBtn"><i class="material-icons-round">menu</i></button>
                <div>
                    <div class="topbar-greeting" id="topbarGreeting">Halo!</div>
                    <div class="topbar-date" id="topbarDate"></div>
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" id="topbarNotif"><i class="material-icons-round">notifications_none</i><span class="notif-dot" id="notifDot" style="display:none;"></span></button>
                <div class="topbar-avatar relative" id="topbarAvatar">
                    <span id="topbarAvatarChar">A</span>
                    <div class="dropdown" id="dropdown">
                        <div class="dd-item" id="ddProfile"><i class="material-icons-round">person</i> Profil</div>
                        <div class="dd-item danger" id="ddLogout"><i class="material-icons-round">logout</i> Keluar</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-content">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-header-content">
                        <button class="btn-cancel" id="cancelBtn">← Batal</button>
                        <h2>Reminder Baru</h2>
                        <button class="btn-save" id="addBtn">Simpan</button>
                    </div>
                </div>
                <div class="form-body">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="taskTitle" placeholder="e.g., Beli perlengkapan kuliah" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="taskNotes" placeholder="Catatan tambahan..."></textarea>
                    </div>

                    <div class="form-group remind-row">
                        <label>Ingatkan saya</label>
                        <label class="switch">
                            <input type="checkbox" id="remindSwitch">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="form-group">
                        <div class="clickable" id="dueDateTrigger">
                            <label style="margin-bottom:0;">Tambah tenggat waktu</label>
                            <span class="add-due-icon">+</span>
                        </div>
                        <div class="due-date-input" id="dueDateInput">
                            <input type="datetime-local" id="taskDueDate">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="taskCategory">
                            <option value="study">📚 Study</option>
                            <option value="personal">🧑 Personal</option>
                            <option value="health">💪 Health</option>
                            <option value="work">💼 Work</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="bnav-item" data-nav="home"><i class="material-icons-round">home</i><span>Home</span></div>
        <div class="bnav-item" data-nav="calendar"><i class="material-icons-round">calendar_month</i><span>Kalender</span></div>
        <div class="bnav-item" data-nav="notification"><i class="material-icons-round">notifications</i><span>Notif</span></div>
        <div class="bnav-item" data-nav="settings"><i class="material-icons-round">settings</i><span>Setting</span></div>
    </nav>
</div>

<script>
    (function() {
        // ========== AUTH & AVATAR (sama persis dengan home) ==========
        const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
        const userEmail = userData.email;
        if (!userEmail) {
            alert('Sesi login tidak ditemukan. Silakan login ulang.');
            window.location.href = 'welcome.html';
            return;
        }

        const firstName = userEmail.split('@')[0];
        const displayName = firstName.charAt(0).toUpperCase() + firstName.slice(1);
        
        // Fungsi update avatar (membaca dari localStorage)
        function updateAvatar() {
            const savedAvatar = localStorage.getItem('user_avatar');
            const sidebarAvatarDiv = document.getElementById('sidebarAvatar');
            const topbarAvatarDiv = document.getElementById('topbarAvatar');
            const topbarAvatarChar = document.getElementById('topbarAvatarChar');
            
            if (!savedAvatar) {
                const defaultChar = userEmail.charAt(0).toUpperCase();
                if (sidebarAvatarDiv) {
                    sidebarAvatarDiv.textContent = defaultChar;
                    sidebarAvatarDiv.style.backgroundImage = '';
                }
                if (topbarAvatarDiv) {
                    topbarAvatarChar.textContent = defaultChar;
                    topbarAvatarDiv.style.backgroundImage = '';
                }
            } else if (savedAvatar.startsWith('data:image')) {
                if (sidebarAvatarDiv) {
                    sidebarAvatarDiv.textContent = '';
                    sidebarAvatarDiv.style.backgroundImage = `url(${savedAvatar})`;
                    sidebarAvatarDiv.style.backgroundSize = 'cover';
                    sidebarAvatarDiv.style.backgroundPosition = 'center';
                }
                if (topbarAvatarDiv) {
                    topbarAvatarChar.textContent = '';
                    topbarAvatarDiv.style.backgroundImage = `url(${savedAvatar})`;
                    topbarAvatarDiv.style.backgroundSize = 'cover';
                    topbarAvatarDiv.style.backgroundPosition = 'center';
                }
            } else {
                if (sidebarAvatarDiv) {
                    sidebarAvatarDiv.textContent = savedAvatar;
                    sidebarAvatarDiv.style.backgroundImage = '';
                }
                if (topbarAvatarDiv) {
                    topbarAvatarChar.textContent = savedAvatar;
                    topbarAvatarDiv.style.backgroundImage = '';
                }
            }
        }

        // Update nama dan email
        document.getElementById('sidebarName').textContent = displayName;
        document.getElementById('sidebarEmail').textContent = userEmail;
        document.getElementById('topbarGreeting').textContent = `Halo, ${displayName}!`;
        document.getElementById('topbarDate').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        
        updateAvatar();

        // ========== SIDEBAR TOGGLE ==========
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const sidebarToggle = document.getElementById('sidebarToggle');
        let sidebarCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
        if (sidebarCollapsed) {
            sidebar.classList.add('collapsed');
            mainContent.classList.add('expanded');
        }
        sidebarToggle.addEventListener('click', () => {
            sidebarCollapsed = !sidebarCollapsed;
            localStorage.setItem('sidebar_collapsed', sidebarCollapsed);
            sidebar.classList.toggle('collapsed', sidebarCollapsed);
            mainContent.classList.toggle('expanded', sidebarCollapsed);
        });

        // ========== MOBILE SIDEBAR ==========
        const overlay = document.getElementById('sidebarOverlay');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        function checkMobile() { mobileMenuBtn.style.display = window.innerWidth <= 900 ? 'flex' : 'none'; }
        checkMobile();
        window.addEventListener('resize', checkMobile);
        mobileMenuBtn.addEventListener('click', () => { sidebar.classList.toggle('mobile-open'); overlay.classList.toggle('show'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); overlay.classList.remove('show'); });

        // ========== DROPDOWN & NAVIGASI ==========
        const avatarBtn = document.getElementById('topbarAvatar');
        const dropdown = document.getElementById('dropdown');
        avatarBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('show'); });
        document.addEventListener('click', () => dropdown.classList.remove('show'));
        document.getElementById('ddProfile').addEventListener('click', () => window.location.href = 'profil.html');
        document.getElementById('ddLogout').addEventListener('click', () => { localStorage.removeItem('remindu_user'); localStorage.removeItem('user_avatar'); window.location.href = 'welcome.html'; });
        document.getElementById('sidebarLogout').addEventListener('click', () => { localStorage.removeItem('remindu_user'); localStorage.removeItem('user_avatar'); window.location.href = 'welcome.html'; });
        document.getElementById('sidebarUser').addEventListener('click', () => window.location.href = 'profil.html');

        function handleNav(nav) {
            if (nav === 'home') window.location.href = 'home.html';
            else if (nav === 'calendar') window.location.href = 'calendar.html';
            else if (nav === 'notification') window.location.href = 'notification.html';
            else if (nav === 'settings') window.location.href = 'settings.html';
        }
        document.querySelectorAll('.nav-item[data-nav]').forEach(el => el.addEventListener('click', () => handleNav(el.dataset.nav)));
        document.querySelectorAll('.bnav-item[data-nav]').forEach(el => el.addEventListener('click', () => handleNav(el.dataset.nav)));
        document.getElementById('topbarNotif').addEventListener('click', () => handleNav('notification'));

        // ========== FORM HANDLER ==========
        const dueDateTrigger = document.getElementById('dueDateTrigger');
        const dueDateDiv = document.getElementById('dueDateInput');
        dueDateTrigger.addEventListener('click', () => {
            dueDateDiv.classList.toggle('active');
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.location.href = 'home.html';
        });

        document.getElementById('addBtn').addEventListener('click', async () => {
            const judul = document.getElementById('taskTitle').value.trim();
            const notes = document.getElementById('taskNotes').value.trim();
            const kategori = document.getElementById('taskCategory').value;
            const remindMe = document.getElementById('remindSwitch').checked;
            let due_date = document.getElementById('taskDueDate').value;
            let remind_at = null;

            if (judul === '') {
                alert('Title tidak boleh kosong');
                return;
            }

            if (remindMe && !due_date) {
                alert('Harap isi due date jika ingin diingatkan');
                return;
            }
            if (remindMe && due_date) {
                remind_at = due_date;
            }
            due_date = due_date || null;

            const taskData = { judul, kategori, notes: notes || '', due_date, remind_at };

            try {
                const response = await fetch('http://localhost:3000/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Email': userEmail
                    },
                    body: JSON.stringify(taskData)
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Gagal menambah task');
                }
                window.location.href = 'home.html';
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // ========== UPDATE NOTIF BADGE (optional) ==========
        async function updateNotifBadge() {
            try {
                const res = await fetch('http://localhost:3000/api/tasks', { headers: { 'X-User-Email': userEmail } });
                if (res.ok) {
                    const tasks = await res.json();
                    const badge = document.getElementById('notifBadge');
                    if (badge) badge.textContent = tasks.filter(t => !t.selesai).length;
                }
            } catch(e) {}
        }
        updateNotifBadge();
    })();
</script>
</body>
</html>
