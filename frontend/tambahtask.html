<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RemindU - Tambah Reminder</title>
    <script>
    (function(){
        var t = localStorage.getItem('remindu_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --purple-light: #ede9fe;
            --bg: #f5f7fe;
            --white: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #edf2f7;
            --sidebar-w: 260px;
            --sidebar-collapsed-w: 72px;
            --header-h: 64px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.38;
            pointer-events: none;
            z-index: 0;
        }
        .bg-blob-1 { width: 400px; height: 400px; background: var(--purple); top: -100px; right: -100px; }
        .bg-blob-2 { width: 300px; height: 300px; background: #ec4899; bottom: -80px; left: -80px; }

        body {
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .layout { display: flex; min-height: 100vh; }

        /* ========== CONTENT AREA ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        .container {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            background: var(--white);
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.02);
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
        }

        .btn-back {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--purple);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 14px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .btn-back:hover { background: var(--purple-light); }

        /* ========== FORM STYLING ========== */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 20px;
        }

        .input-wrapper input,
        .input-wrapper textarea,
        .input-wrapper select {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            color: var(--text);
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }

        .input-wrapper textarea {
            padding-left: 44px;
            min-height: 100px;
            resize: vertical;
        }

        .input-wrapper input:focus,
        .input-wrapper textarea:focus,
        .input-wrapper select:focus {
            border-color: var(--purple);
            background: white;
            box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
        }

        /* Input khusus Kategori */
        .category-select-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .category-card {
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .category-card i { font-size: 24px; }
        .category-card span { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        .category-card.selected[data-cat="Kuliah"] { border-color: var(--blue); background: #eff6ff; }
        .category-card.selected[data-cat="Kuliah"] span { color: var(--blue); }
        .category-card.selected[data-cat="Kuliah"] i { color: var(--blue); }

        .category-card.selected[data-cat="Kerja"] { border-color: var(--orange); background: #fff7ed; }
        .category-card.selected[data-cat="Kerja"] span { color: var(--orange); }
        .category-card.selected[data-cat="Kerja"] i { color: var(--orange); }

        .category-card.selected[data-cat="Lainnya"] { border-color: var(--purple); background: var(--purple-light); }
        .category-card.selected[data-cat="Lainnya"] span { color: var(--purple); }
        .category-card.selected[data-cat="Lainnya"] i { color: var(--purple); }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--purple-dark), var(--purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(139,92,246,0.25);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(139,92,246,0.35);
        }

        .btn-submit:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ========== DARK MODE CSS ========== */
        [data-theme="dark"] { --purple:#a78bfa; --purple-dark:#8b5cf6; --purple-light:#2d1f5e; --bg:#0f0f13; --white:#1a1a24; --text:#f1f5f9; --text-muted:#94a3b8; --border:#2a2a3a; }
        [data-theme="dark"] body { background:var(--bg); color:var(--text); }
        [data-theme="dark"] .sidebar,[data-theme="dark"] .topbar,[data-theme="dark"] .dropdown,[data-theme="dark"] .bottom-nav,[data-theme="dark"] .form-card { background:var(--white) !important; border-color:var(--border) !important; }
        [data-theme="dark"] .nav-item { color:var(--text-muted) !important; }
        [data-theme="dark"] .nav-item:hover { background:rgba(167,139,250,0.08) !important; color:var(--purple) !important; }
        [data-theme="dark"] .nav-item.active { background:var(--purple-light) !important; color:var(--purple) !important; }
        [data-theme="dark"] .topbar-greeting,[data-theme="dark"] .sidebar-user-name { color:var(--text) !important; }
        [data-theme="dark"] .topbar-date,[data-theme="dark"] .sidebar-user-email,[data-theme="dark"] .nav-label { color:var(--text-muted) !important; }
        [data-theme="dark"] .toggle-btn,[data-theme="dark"] .topbar-icon-btn,[data-theme="dark"] .topbar-mobile-toggle { background:#13131e !important; color:var(--text-muted) !important; }
        [data-theme="dark"] .form-group label { color:var(--text-muted) !important; }
        [data-theme="dark"] .form-group input,[data-theme="dark"] .form-group textarea,[data-theme="dark"] .form-group select { color:var(--text) !important; }
        [data-theme="dark"] input[type="datetime-local"] { background:#13131e !important; border-color:var(--border) !important; color:var(--text) !important; }
        [data-theme="dark"] .dd-item { color:var(--text) !important; }
        [data-theme="dark"] .dd-item:hover { background:#13131e !important; }
        [data-theme="dark"] .dd-item.danger { color:#f87171 !important; }
        [data-theme="dark"] .bnav-item { color:var(--text-muted) !important; }
        [data-theme="dark"] .bnav-item.active { background:var(--purple-light) !important; color:var(--purple) !important; }
        [data-theme="dark"] .bg-blob-1,[data-theme="dark"] .bg-blob-2 { opacity:0.07 !important; }
        [data-theme="dark"] .sidebar-header,[data-theme="dark"] .sidebar-user,[data-theme="dark"] .sidebar-footer { border-color:var(--border) !important; }
        [data-theme="dark"] .sidebar-overlay { background:rgba(0,0,0,0.6) !important; }
        [data-theme="dark"] .btn-save { background:#2d1f5e !important; color:#a78bfa !important; }
        [data-theme="dark"] .btn-save:hover { background:#3d2a7a !important; }
    </style>
</head>
<body>

<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<div class="layout">
    <main class="main-content">
        <div class="container">
            <div class="header">
                <h1 class="page-title" data-i18n="tambahtask.title">Tambah Pengingat</h1>
                <button class="btn-back" id="backBtn">
                    <i class="material-icons-round">arrow_back</i>
                    <span data-i18n="tambahtask.btn_back">Kembali</span>
                </button>
            </div>

            <form id="taskForm">
                <div class="form-group">
                    <label data-i18n="tambahtask.label_judul">Judul Pengingat / Tugas</label>
                    <div class="input-wrapper">
                        <i class="material-icons-round">title</i>
                        <input type="text" id="judulInput" data-i18n-placeholder="tambahtask.placeholder_judul" placeholder="Contoh: Kuis Rekayasa Perangkat Lunak" required>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="tambahtask.label_kategori">Kategori Pengingat</label>
                    <div class="category-select-wrapper">
                        <div class="category-card selected" data-cat="Kuliah">
                            <i class="material-icons-round" style="color:var(--blue)">school</i>
                            <span data-i18n="tambahtask.cat_school">Kuliah</span>
                        </div>
                        <div class="category-card" data-cat="Kerja">
                            <i class="material-icons-round" style="color:var(--orange)">work</i>
                            <span data-i18n="tambahtask.cat_work">Kerja</span>
                        </div>
                        <div class="category-card" data-cat="Lainnya">
                            <i class="material-icons-round" style="color:var(--purple)">dashboard_customize</i>
                            <span data-i18n="tambahtask.cat_other">Lainnya</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="tambahtask.label_deadline">Waktu Jatuh Tempo (Deadline)</label>
                    <div class="input-wrapper">
                        <i class="material-icons-round">calendar_month</i>
                        <input type="datetime-local" id="dueDateInput" required>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="tambahtask.label_remind">Ingatkan Saya Pada</label>
                    <div class="input-wrapper">
                        <i class="material-icons-round">alarm</i>
                        <input type="datetime-local" id="remindAtInput">
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="tambahtask.label_catatan">Catatan Deskripsi Tambahan (Opsional)</label>
                    <div class="input-wrapper">
                        <i class="material-icons-round" style="top: 14px;">description</i>
                        <textarea id="notesInput" data-i18n-placeholder="tambahtask.placeholder_catatan" placeholder="Tulis rincian tugas atau info tambahan di sini..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="material-icons-round">add_task</i>
                    <span id="submitBtnText" data-i18n="tambahtask.btn_submit">Simpan Pengingat</span>
                </button>
            </form>
        </div>
    </main>
</div>

<script>
(() => {
    const API_URL = 'http://localhost:3000/api';
    const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
    const userEmail = userData.email;

    if (!userEmail) {
        window.location.href = 'welcome.html';
        return;
    }

    // Mengatur default minimal waktu input datetime-local adalah waktu saat ini
    const now = new Date();
    const tzoffset = now.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(now - tzoffset)).toISOString().slice(0, 16);
    document.getElementById('dueDateInput').min = localISOTime;
    if (document.getElementById('remindAtInput')) {
        document.getElementById('remindAtInput').min = localISOTime;
    }

    // Logika pemilihan kartu kategori
    let selectedCategory = 'Kuliah';
    const cards = document.querySelectorAll('.category-card');
    cards.forEach(card => {
        card.addEventListener('click', () => {
            cards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedCategory = card.dataset.cat;
        });
    });

    // Navigasi tombol kembali
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'home.html';
    });

    // Pengiriman Form ke Backend API
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const judul = document.getElementById('judulInput').value.trim();
        const due_date = document.getElementById('dueDateInput').value;
        const remind_at = document.getElementById('remindAtInput').value || null;
        const notes = document.getElementById('notesInput').value.trim() || null;
        const btn = document.getElementById('submitBtn');

        // Validasi Logika Waktu
        if (remind_at && new Date(remind_at) > new Date(due_date)) {
            const errRemind = window.t ? window.t('tambahtask.err_remind_time') : '⚠️ Waktu pengingat alarm tidak boleh melampaui waktu jatuh tempo tugas!';
            showToast(errRemind, 'error');
            return;
        }

        btn.disabled = true;
        const loadingText = window.t ? window.t('tambahtask.btn_loading') : 'Menyimpan...';
        document.getElementById('submitBtnText').textContent = loadingText;

        try {
            const res = await fetch(`${API_URL}/tasks`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-User-Email': userEmail
                },
                body: JSON.stringify({ judul, kategori: selectedCategory, due_date, remind_at, notes })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Gagal menyimpan tugas');

            const successMsg = window.t ? window.t('tambahtask.success_add') : '✅ Pengingat baru berhasil ditambahkan!';
            showToast(successMsg, 'success');
            setTimeout(() => window.location.href = 'home.html', 1200);
        } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
            document.getElementById('submitBtnText').setAttribute('data-i18n', 'tambahtask.btn_submit');
            if (window.applyLang) window.applyLang(); // Kembalikan teks asli tombol sesuai bahasa aktif
        }
    });

    // Engine UI Toast Notification bawaan halaman
    function showToast(msg, type = 'success') {
        let t = document.getElementById('customToast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'customToast';
            t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:white;padding:12px 24px;border-radius:40px;font-size:14px;font-weight:500;z-index:9999;transition:transform 0.3s;white-space:nowrap;';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.background = type === 'success' ? '#10b981' : type === 'error' ? '#e53e3e' : '#1e293b';
        t.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => t.style.transform = 'translateX(-50%) translateY(80px)', 3500);
    }
})();
</script>

<script src="lang.js"></script>
<script>
    if (typeof applyLang === 'function') {
        applyLang();
    }
</script>

<button id="darkFab" style="position:fixed;bottom:88px;right:18px;z-index:9999;width:44px;height:44px;border-radius:50%;border:none;background:var(--purple);color:white;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(139,92,246,0.35);display:flex;align-items:center;justify-content:center;">🌙</button>
<script>
(function(){
    var fab = document.getElementById('darkFab');
    fab.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    fab.addEventListener('click', function(){
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('remindu_theme', next);
        fab.textContent = next === 'dark' ? '☀️' : '🌙';
    });
})();
</script>
</body>
</html>
