<script>
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // Ganti dengan Client ID Anda jika menggunakan Google Sign-In
const API_URL = 'http://localhost:3000/api';

function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show' + (type === 'error' ? ' error' : '');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// Konfigurasi Google One Tap awal otomatis saat halaman web dimuat
window.onload = function () {
    if (typeof google !== 'undefined' && GOOGLE_CLIENT_ID !== 'YOUR_GOOGLE_CLIENT_ID') {
        google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleOneTap
        });
        google.accounts.id.prompt(); // Tampilkan popup Google One Tap
    }
};

// Form Register Manual
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const fullname = document.getElementById('fullnameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const btn = document.getElementById('signupBtn');

    if (password.length < 6) {
        const errMinLen = window.t ? window.t('register.err_password_min_length') : 'Kata sandi minimal harus 6 karakter!';
        showToast(errMinLen, 'error');
        return;
    }

    btn.disabled = true;
    const loadingText = window.t ? window.t('register.btn_loading') : 'Mendaftarkan...';
    document.getElementById('signupBtnText').textContent = loadingText;

    const splitName = fullname.split(' ');
    const nama_depan = splitName[0];
    const nama_belakang = splitName.slice(1).join(' ') || '';

    try {
        const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nama_depan, nama_belakang, email, password })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Pendaftaran gagal');

        const successMsg = window.t ? window.t('register.success_register') : '✅ Akun berhasil dibuat! Silakan cek email verifikasi.';
        showToast(successMsg, 'success');
        
        // Simpan email sementara di LocalStorage untuk mempermudah proses verify.html jika dibutuhkan
        localStorage.setItem('remindu_verify_email', email);
        setTimeout(() => window.location.href = 'verify.html', 1200);
    } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        document.getElementById('signupBtnText').setAttribute('data-i18n', 'register.btn_submit');
        if (window.applyLang) window.applyLang(); // Kembalikan teks tombol sesuai bahasa aktif
    }
});

// Google Register (sama flow dengan login redireksi)
function registerWithGoogle() {
    if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID') {
        const errConfig = window.t ? window.t('register.err_google_not_configured') : '⚠️ Google Sign-In belum dikonfigurasi. Hubungi admin.';
        showToast(errConfig, 'error');
        return;
    }
    window.location.href = 'http://localhost:3000/auth/google';
}

// Google One Tap Callback Token Handler
async function handleGoogleOneTap(response) {
    if (!response?.credential) return;
    try {
        const res = await fetch(`${API_URL}/auth/google-token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        
        localStorage.setItem('remindu_user', JSON.stringify({ 
            email: data.email, 
            firstName: data.nama_depan, 
            provider: 'google' 
        }));
        
        const successGoogle = window.t ? window.t('register.success_google') : '✅ Daftar via Google berhasil!';
        showToast(successGoogle, 'success');
        setTimeout(() => window.location.href = 'home.html', 800);
    } catch (err) {
        showToast(err.message || 'Google Register Gagal', 'error');
    }
}
</script>
