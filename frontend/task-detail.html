<script>
(() => {
    const API_URL = 'http://localhost:3000/api';
    const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
    const userEmail = userData.email;

    if (!userEmail) {
        window.location.href = 'welcome.html';
        return;
    }

    // Mendapatkan parameter ID Task dari URL (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get('id');

    if (!taskId) {
        alert(window.t ? window.t('task_detail.err_no_id') : 'ID tugas tidak valid!');
        window.location.href = 'home.html';
        return;
    }

    async function loadTaskDetail() {
        try {
            const res = await fetch(`${API_URL}/tasks/${taskId}`, {
                headers: { 'X-User-Email': userEmail }
            });
            if (!res.ok) throw new Error();
            const task = await res.json();
            renderDetail(task);
        } catch (err) {
            document.getElementById('detailContainer').innerHTML = `
                <div style="text-align:center; padding:40px 0; color:var(--text-muted);">
                    <i class="material-icons-round" style="font-size:48px; color:#cbd5e1; margin-bottom:12px;">error_outline</i>
                    <p style="font-weight:600;" data-i18n="task_detail.err_load">Gagal memuat rincian data pengingat.</p>
                    <button class="btn-action btn-back" style="margin:16px auto 0;" onclick="window.location.href='home.html'">
                        <i class="material-icons-round">arrow_back</i> <span data-i18n="task_detail.btn_back">Kembali</span>
                    </button>
                </div>
            `;
            if (window.applyLang) window.applyLang();
        }
    }

    function renderDetail(task) {
        const container = document.getElementById('detailContainer');
        
        // Formatter Waktu Lokal Sesuai Preferensi Bahasa
        const currentLang = localStorage.getItem('remindu_lang') || 'id';
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        
        const dueDateStr = task.due_date ? new Date(task.due_date).toLocaleString(currentLang, dateOptions) : '-';
        const remindAtStr = task.remind_at ? new Date(task.remind_at).toLocaleString(currentLang, dateOptions) : (window.t ? window.t('task_detail.no_alarm') : 'Tidak diatur');

        // Internasionalisasi Teks Status & Kategori Secara Dinamis
        let statusText = task.selesai ? 'Selesai' : 'Belum Selesai';
        if (window.t) {
            statusText = task.selesai ? window.t('task_detail.status_done') : window.t('task_detail.status_pending');
        }

        let categoryText = task.kategori || 'Lainnya';
        if (window.t) {
            if (task.kategori === 'Kuliah') categoryText = window.t('task_detail.cat_school');
            else if (task.kategori === 'Kerja') categoryText = window.t('task_detail.cat_work');
            else if (task.kategori === 'Lainnya') categoryText = window.t('task_detail.cat_other');
        }

        // Penghitungan Logika Progress Persentase Waktu Menuju Deadline
        let progressHtml = '';
        if (task.due_date && !task.selesai) {
            const createdAt = task.created_at ? new Date(task.created_at).getTime() : new Date().getTime() - 86400000;
            const dueDate = new Date(task.due_date).getTime();
            const now = new Date().getTime();

            const totalDuration = dueDate - createdAt;
            const elapsed = now - createdAt;
            
            let progressPercent = 0;
            if (totalDuration > 0) {
                progressPercent = Math.min(100, Math.max(0, Math.round((elapsed / totalDuration) * 100)));
            }

            const labelProgress = window.t ? window.t('task_detail.progress_label') : 'Progress waktu menuju deadline';
            const descProgress = window.t ? window.t('task_detail.progress_desc', { percent: progressPercent }) : `${progressPercent}% waktu telah berlalu`;

            progressHtml = `
                <div class="progress-section">
                    <div class="progress-label">${labelProgress}</div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                    </div>
                    <div class="progress-desc">${descProgress}</div>
                </div>
            `;
        }

        // Teks Deskripsi Catatan Kosong Bawaan
        const emptyNotesText = window.t ? window.t('task_detail.no_notes') : 'Tidak ada catatan tambahan untuk tugas ini.';
        const notesContent = task.notes ? escapeHtml(task.notes) : `<span style="color:var(--text-muted); font-style:italic;">${emptyNotesText}</span>`;

        container.innerHTML = `
            <div class="header">
                <h1 class="page-title" data-i18n="task_detail.title">Detail Pengingat</h1>
                <button class="btn-action btn-back" id="headerBackBtn">
                    <i class="material-icons-round">arrow_back</i>
                    <span data-i18n="task_detail.btn_back">Kembali</span>
                </button>
            </div>

            <div class="detail-card">
                <h2 class="task-title-large">${escapeHtml(task.judul)}</h2>
                
                <div class="meta-grid">
                    <div class="meta-item">
                        <div class="meta-icon info"><i class="material-icons-round">category</i></div>
                        <div class="meta-info">
                            <span class="meta-label" data-i18n="task_detail.label_kategori">Kategori</span>
                            <span class="meta-value">${categoryText}</span>
                        </div>
                    </div>
                    
                    <div class="meta-item">
                        <div class="meta-icon calendar"><i class="material-icons-round">calendar_today</i></div>
                        <div class="meta-info">
                            <span class="meta-label" data-i18n="task_detail.label_deadline">Batas Waktu</span>
                            <span class="meta-value">${dueDateStr}</span>
                        </div>
                    </div>
                    
                    <div class="meta-item">
                        <div class="meta-icon alarm"><i class="material-icons-round">alarm</i></div>
                        <div class="meta-info">
                            <span class="meta-label" data-i18n="task_detail.label_remind">Waktu Alarm</span>
                            <span class="meta-value">${remindAtStr}</span>
                        </div>
                    </div>
                    
                    <div class="meta-item">
                        <div class="meta-icon status" style="${task.selesai ? 'background:#e6f4ea; color:var(--green);' : 'background:#fef3c7; color:var(--amber);'}">
                            <i class="material-icons-round">${task.selesai ? 'check_circle' : 'hourglass_empty'}</i>
                        </div>
                        <div class="meta-info">
                            <span class="meta-label" data-i18n="task_detail.label_status">Status</span>
                            <span class="meta-value">${statusText}</span>
                        </div>
                    </div>
                </div>
                
                <div class="notes-section">
                    <span class="notes-heading" data-i18n="task_detail.label_catatan">Catatan Deskripsi</span>
                    <p class="notes-content">${notesContent}</p>
                </div>
                
                ${progressHtml}
                
                <div class="action-buttons">
                    <button class="btn-action btn-back" id="backBtn">
                        <i class="material-icons-round">arrow_back</i> 
                        <span data-i18n="task_detail.btn_back">Kembali</span>
                    </button>
                    <button class="btn-action btn-edit" id="editBtn">
                        <i class="material-icons-round">edit</i> 
                        <span data-i18n="task_detail.btn_edit">Edit Task</span>
                    </button>
                </div>
            </div>
        `;

        // Daftarkan ulang Event Listener setelah elemen di-render ke DOM
        document.getElementById('headerBackBtn').addEventListener('click', () => window.location.href = 'home.html');
        document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'home.html');
        
        document.getElementById('editBtn').addEventListener('click', () => {
            const comingSoonText = window.t ? window.t('task_detail.edit_coming_soon') : `Fitur edit task untuk ID ${task.id_task} akan segera hadir.`;
            alert(comingSoonText);
        });

        // Jalankan interpreter bahasa eksternal untuk menerjemahkan elemen data-i18n statis
        if (typeof applyLang === 'function') {
            applyLang();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    loadTaskDetail();
})();
</script>

<script src="lang.js"></script>
<script>
    if (typeof applyLang === 'function') {
        applyLang();
    }
</script>

<button id="darkFab" style="position:fixed;bottom:88px;right:18px;z-index:9999;width:44px;height:44px;border-radius:50%;border:none;background:var(--purple);color:white;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(139,92,246,0.35);display:flex;align-items:center;justify-content:center;">🌙</button>
<script>
(function(){
    var fab = document.getElementById('darkFab');
    fab.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    fab.addEventListener('click', function(){
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('remindu_theme', next);
        fab.textContent = next === 'dark' ? '☀️' : '🌙';
    });
})();
</script>
