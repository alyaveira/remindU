<div class="container">
    <div class="page-content">
        <div class="header">

                <span id="avatarChar">A</span>
                <div class="edit-overlay"><i class="material-icons-round">edit</i></div>
            </div>
            <button class="btn-change-photo" id="changePhotoBtn" data-i18n="editprofile.upload_photo">Pilih Foto Galeri</button>
            <input type="file" id="photoInput" accept="image/png, image/jpeg, image/jpg">

            <div class="avatar-option" data-avatar="🎯">🎯</div>
            <div class="avatar-option" data-avatar="🦊">🦊</div>
            <div class="avatar-option" data-avatar="🐱">🐱</div>
            <div class="avatar-option" data-avatar="🪐">🪐</div>
            <div class="avatar-option" data-avatar="🎨">🎨</div>
        </div>

        <div class="form-grid">

                <label data-i18n="editprofile.label_email">Alamat Email (Tetap)</label>
                <div class="input-wrapper">
                    <i class="material-icons-round">mail_outline</i>
                    <input type="email" id="emailInput" disabled>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n="editprofile.label_name">Nama Pengguna Baru</label>
                <div class="input-wrapper">
                    <i class="material-icons-round">person_outline</i>
                    <input type="text" id="nameInput" data-i18n-placeholder="editprofile.placeholder_name" placeholder="Masukkan nama baru">
                </div>
            </div>

</div>

<script>
(function() {
    const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
    const userEmail = userData.email;
    if (!userEmail) { window.location.href = 'welcome.html'; return; }

    const emailInput = document.getElementById('emailInput');
    const nameInput = document.getElementById('nameInput');
    const avatarTrigger = document.getElementById('avatarTrigger');
    const avatarChar = document.getElementById('avatarChar');
    const avatarGrid = document.getElementById('avatarGrid');
    const changePhotoBtn = document.getElementById('changePhotoBtn');
    const photoInput = document.getElementById('photoInput');

    // Mengambil inisial default huruf depan email
    const defaultChar = userEmail.charAt(0).toUpperCase();
    let currentAvatar = localStorage.getItem('user_avatar') || '';

    emailInput.value = userEmail;
    
    // Mengambil tampilan nama custom opsional dari localStorage jika pernah disimpan
    const savedName = localStorage.getItem('user_display_name');
    if (savedName) {
        nameInput.value = savedName;
    } else {
        const firstName = userEmail.split('@')[0];
        nameInput.value = firstName.charAt(0).toUpperCase() + firstName.slice(1);
    }

    function displayAvatar(val) {
        if (!val) {
            avatarChar.textContent = defaultChar;
            avatarTrigger.style.backgroundImage = '';
        } else if (val.startsWith('data:image')) {
            avatarChar.textContent = '';
            avatarTrigger.style.backgroundImage = `url(${val})`;
        } else {
            avatarChar.textContent = val;
            avatarTrigger.style.backgroundImage = '';
        }
    }
    displayAvatar(currentAvatar);

    // Tandai emoji yang sedang terpilih saat ini pada grid internal jika ada
    if (currentAvatar && !currentAvatar.startsWith('data:image')) {
        document.querySelectorAll('.avatar-option').forEach(opt => {
            if (opt.dataset.avatar === currentAvatar) opt.classList.add('selected');
        });
    }

    // Toggle grid avatar emoji internal
    avatarTrigger.addEventListener('click', () => {
        avatarGrid.style.display = avatarGrid.style.display === 'grid' ? 'none' : 'grid';
    });

    // Event click untuk setiap pilihan di grid emoji
    document.querySelectorAll('.avatar-option').forEach(option => {
        option.addEventListener('click', () => {
            document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');
            currentAvatar = option.dataset.avatar;
            displayAvatar(currentAvatar);
            avatarGrid.style.display = 'none';
        });
    });

    // Tombol pemicu pencarian berkas galeri lokal
    changePhotoBtn.addEventListener('click', () => {
        photoInput.click();
    });

    // Memproses data gambar dari media lokal penyimpanan user
    photoInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            const errType = window.t ? window.t('editprofile.err_type') : 'Harap pilih file gambar (PNG, JPG, JPEG)';
            alert(errType);
            return;
        }
        if (file.size > 2 * 1024 * 1024) {
            const errSize = window.t ? window.t('editprofile.err_size') : 'Ukuran maksimal 2MB';
            alert(errSize);
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            currentAvatar = base64;
            displayAvatar(currentAvatar);
            document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
            avatarGrid.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    // Fungsi menyimpan perubahan data profil
    function saveProfile() {
        const newName = nameInput.value.trim();
        if (!newName) {
            const errEmpty = window.t ? window.t('editprofile.err_empty_name') : 'Nama tidak boleh kosong!';
            alert(errEmpty);
            return;
        }
        localStorage.setItem('user_display_name', newName);
        if (currentAvatar) {
            localStorage.setItem('user_avatar', currentAvatar);
        } else {
            localStorage.removeItem('user_avatar');
        }
        
        const successMsg = window.t ? window.t('editprofile.success_save') : 'Profil Anda berhasil diperbarui!';
        alert(successMsg);
        window.location.href = 'profil.html';
    }

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'profil.html';
    });
    
    document.getElementById('saveBtn').addEventListener('click', saveProfile);
})();
</script>

<script>
(function(){
    var fab = document.getElementById('darkFab');
    fab.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    fab.addEventListener('click', function(){
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('remindu_theme', next);
        fab.textContent = next === 'dark' ? '☀️' : '🌙';
    });
})();
</script>
