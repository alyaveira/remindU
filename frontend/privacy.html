<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemindU - Privacy</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --purple-light: #ede9fe;
            --bg: #f5f7fe;
            --white: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #edf2f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        .bg-blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.38; pointer-events: none; z-index: 0; }
        .bg-blob-1 { width: 400px; height: 400px; background: var(--purple); top: -100px; right: -100px; }
        .bg-blob-2 { width: 300px; height: 300px; background: #ec4899; bottom: -80px; left: -80px; }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--white);
            border-radius: 36px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }
        .page-content { padding: 28px 24px 36px; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .btn-back {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: var(--purple);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-back:hover { background: var(--purple-light); }
        h2 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn-save {
            background: var(--purple);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-save:hover { background: var(--purple-dark); transform: translateY(-1px); }

        .section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 20px 0 12px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .input-wrapper { position: relative; }
        .input-wrapper input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 12px 45px 12px 18px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            color: var(--text);
            transition: border-color 0.2s, background 0.2s;
        }
        .input-wrapper input:focus { border-color: var(--purple); background: white; }
        .input-wrapper input[readonly] { cursor: default; color: var(--text-muted); }
        .input-wrapper i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 20px;
            pointer-events: none;
        }
        .input-wrapper .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }
        .input-wrapper .eye-btn:hover { color: var(--purple); }

        .masked-email {
            font-weight: 600;
            color: var(--text);
            font-size: 15px;
        }

        hr { margin: 24px 0; border: none; border-top: 1px solid var(--border); }

        .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; padding-left: 8px; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (min-width: 768px) {
            .page-content { padding: 40px 48px; }
        }
    </style>
</head>
<body>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<div class="container">
    <div class="page-content">
        <div class="header">
            <button class="btn-back" id="backBtn">
                <i class="material-icons-round" style="font-size:18px;">arrow_back</i> Back
            </button>
            <h2>Privacy</h2>
            <button class="btn-save" id="saveBtn">Save</button>
        </div>

        <!-- Email Section -->
        <div class="section-label">Akun Email</div>
        <div class="form-group">
            <label>Email Saat Ini</label>
            <div class="input-wrapper">
                <input type="text" id="currentEmailDisplay" readonly>
                <i class="material-icons-round">email</i>
            </div>
        </div>
        <div class="form-group">
            <label>Ganti Email (Opsional)</label>
            <div class="input-wrapper">
                <input type="email" id="newEmail" placeholder="Email baru (kosongkan jika tidak ingin ganti)">
                <i class="material-icons-round">edit</i>
            </div>
            <div class="hint">Email baru harus valid dan belum terdaftar.</div>
        </div>

        <hr>

        <!-- Password Section -->
        <div class="section-label">Keamanan Password</div>
        <div class="form-group">
            <label>Password Saat Ini</label>
            <div class="input-wrapper">
                <input type="password" id="currentPassword" placeholder="Masukkan password saat ini">
                <button class="eye-btn" onclick="togglePwd('currentPassword', this)">
                    <i class="material-icons-round">visibility_off</i>
                </button>
            </div>
        </div>
        <div class="form-group">
            <label>Password Baru (Opsional)</label>
            <div class="input-wrapper">
                <input type="password" id="newPassword" placeholder="Password baru">
                <button class="eye-btn" onclick="togglePwd('newPassword', this)">
                    <i class="material-icons-round">visibility_off</i>
                </button>
            </div>
        </div>
        <div class="form-group">
            <label>Konfirmasi Password Baru</label>
            <div class="input-wrapper">
                <input type="password" id="confirmPassword" placeholder="Ulangi password baru">
                <button class="eye-btn" onclick="togglePwd('confirmPassword', this)">
                    <i class="material-icons-round">visibility_off</i>
                </button>
            </div>
            <div class="hint">Password minimal 8 karakter, huruf kecil & angka.</div>
        </div>

        <hr>

        <!-- Phone Section -->
        <div class="section-label">Nomor Telepon</div>
        <div class="form-group">
            <label>Nomor Telepon Saat Ini</label>
            <div class="input-wrapper">
                <input type="text" id="currentPhone" readonly placeholder="+62 (belum diatur)">
                <i class="material-icons-round">phone</i>
            </div>
        </div>
        <div class="form-group">
            <label>Ganti Nomor (Opsional)</label>
            <div class="input-wrapper">
                <input type="tel" id="newPhone" placeholder="+62 8xx xxxx xxxx">
                <i class="material-icons-round">edit</i>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_URL = 'http://localhost:3000/api';
    const userData = JSON.parse(localStorage.getItem('remindu_user') || '{}');
    const userEmail = userData.email;
    if (!userEmail) { alert('Sesi tidak ditemukan.'); window.location.href = 'welcome.html'; }

    function maskEmail(email) {
        const [local, domain] = email.split('@');
        if (local.length <= 2) return email;
        return local[0] + '*'.repeat(Math.min(local.length - 2, 6)) + local[local.length - 1] + '@' + domain;
    }

    function maskPhone(phone) {
        if (!phone) return '';
        return phone.slice(0, 4) + ' *** ' + phone.slice(-3);
    }

    // Load profile data
    async function loadProfile() {
        try {
            const res = await fetch(`${API_URL}/profile`, {
                headers: { 'X-User-Email': userEmail }
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            document.getElementById('currentEmailDisplay').value = maskEmail(userEmail);
            document.getElementById('currentPhone').value = data.nomor_telepon ? maskPhone(data.nomor_telepon) : '';
        } catch {
            document.getElementById('currentEmailDisplay').value = maskEmail(userEmail);
        }
    }
    loadProfile();

    function togglePwd(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.background = isError ? '#e53e3e' : '#1e293b';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const newEmail = document.getElementById('newEmail').value.trim();
        const newPhone = document.getElementById('newPhone').value.trim();

        // Validate password change
        if (newPassword || confirmPassword) {
            if (!currentPassword) { showToast('Masukkan password saat ini', true); return; }
            if (newPassword !== confirmPassword) { showToast('Konfirmasi password tidak cocok', true); return; }
            if (newPassword.length < 8 || !/[a-z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                showToast('Password minimal 8 karakter, huruf kecil & angka', true); return;
            }
        }

        const payload = {};
        if (newPassword) { payload.currentPassword = currentPassword; payload.newPassword = newPassword; }
        if (newEmail) payload.newEmail = newEmail;
        if (newPhone) payload.phone = newPhone;

        if (Object.keys(payload).length === 0) { showToast('Tidak ada perubahan yang disimpan'); return; }

        try {
            const res = await fetch(`${API_URL}/privacy`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-User-Email': userEmail },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            if (newEmail) {
                const updatedUser = JSON.parse(localStorage.getItem('remindu_user') || '{}');
                updatedUser.email = newEmail;
                localStorage.setItem('remindu_user', JSON.stringify(updatedUser));
            }

            showToast('✅ Perubahan berhasil disimpan!');
            setTimeout(() => window.location.href = 'profil.html', 1500);
        } catch (err) {
            showToast(err.message || 'Terjadi kesalahan', true);
        }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'profil.html';
    });
</script>
</body>
</html>
