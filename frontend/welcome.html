<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RemindU - Selamat Datang</title>
    <style>
        /* --- ROOT VARIABLES (dari welcomebaru) --- */
        :root {
            --purple: #8b5cf6;
            --purple-dark: #7c3aed;
            --purple-light: #ede9fe;
            --bg: #f5f7fe;
            --white: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #edf2f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
        }

        /* --- BG DECORATION --- */
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.38;
            pointer-events: none;
            z-index: 0;
        }

        .bg-blob-1 {
            width: 400px;
            height: 400px;
            background: var(--purple);
            top: -100px;
            right: -100px;
        }

        .bg-blob-2 {
            width: 300px;
            height: 300px;
            background: #ec4899;
            bottom: -80px;
            left: -80px;
        }

        /* --- CARD STYLE --- */
        .card {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 24px 50px -12px rgba(139, 92, 246, 0.12);
            padding: 48px 36px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            z-index: 10;
            position: relative;
        }

        /* FIX WARNING: Menambahkan background-clip standar */
        h1 {
            font-size: 48px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -1.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text), var(--purple-dark));
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        .desc-text {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 500;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- BUTTONS --- */
        .btn-get-started {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--purple-dark), var(--purple));
            color: var(--white);
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.25);
            transition: all 0.25s ease;
            margin-bottom: 20px;
        }

        .btn-get-started:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(139, 92, 246, 0.35);
        }

        .btn-get-started:active {
            transform: translateY(0);
        }

        /* --- ACCENT LINK --- */
        .login-link {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .login-link a {
            color: var(--purple-dark);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
            margin-left: 4px;
        }

        .login-link a:hover {
            color: var(--purple);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 42px; }
            .desc-text { font-size: 1rem; max-width: 100%; }
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeSlide 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <div class="card">
        <h1>RemindU</h1>
        <p class="desc-text" data-i18n="welcome.subtitle">Start minimizing missed deadlines and foster a more balanced workflow today.</p>
        
        <!-- FIX ERROR: Menghilangkan tanda backslash pada onclick -->
        <button class="btn-get-started" onclick="window.location.href='login.html'" data-i18n="welcome.btn_get_started">Get Started</button>
        
        <div class="login-link">
            <span data-i18n="welcome.txt_have_account">Already have an account?</span>
            <a href="login.html" data-i18n="welcome.btn_login">Sign In</a>
        </div>
    </div>

    <!-- ENGINE INTERPRETER SCRIPT LANG.JS -->
    <script src="lang.js"></script>
    <script>
        if (typeof applyLang === 'function') {
            applyLang();
        }
    </script>
</body>
</html>
